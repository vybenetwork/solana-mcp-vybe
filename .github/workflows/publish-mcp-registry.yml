name: Publish to MCP Registry

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: mcp-registry-publish
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          jq --arg v "$VERSION" '.version = $v' server.json > server.tmp && mv server.tmp server.json
          echo "Publishing version ${VERSION}"
          cat server.json

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Install mcp-publisher
        run: |
          go install github.com/modelcontextprotocol/registry/cmd/publisher@v1.8.6
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          publisher version

      - name: Validate server.json
        run: publisher validate server.json

      - name: Authenticate (GitHub OIDC)
        run: publisher login github-oidc

      - name: Publish to registry.modelcontextprotocol.io
        run: publisher publish server.json
